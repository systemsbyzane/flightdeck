name: Mission stress

"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mission-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Synthetic replay and fan-out stress
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run bounded synthetic Mission stress suite
        run: make mission-stress

      - name: Confirm stress validation did not modify source
        run: |
          git diff --exit-code
          git status --short
          test -z "$(git status --porcelain=v1)"
