name: Public validation

"on":
  pull_request: {}
  push: {}

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source-local validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Test public manifest validation
        run: ruby .github/tests/validate_public_manifests_test.rb

      - name: Validate plugin and skill manifests
        run: ruby .github/scripts/validate_public_manifests.rb plugins/flightdeck

      - name: Run public source-local validation
        env:
          LOCAL_EVIDENCE: ${{ runner.temp }}/flightdeck-validation
        run: make public-validate

      - name: Confirm validation did not modify source
        run: |
          git diff --exit-code
          git status --short
          test -z "$(git status --porcelain=v1)"
