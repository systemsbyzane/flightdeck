api_version: flightdeck.dev/v1alpha1
kind: AutomationTemplate
metadata:
  name: daily-workspace-health
  display_name: Daily Workspace Health
enabled: false
activation:
  policy: explicit_user_enablement
  required_confirmation: [scope, schedule, timezone, output_destination]
schedule:
  type: cron
  expression: "0 8 * * 1-5"
  timezone: Etc/UTC
task:
  workflow: daily-ops
  outcome: Produce a read-only workspace health snapshot and action queue.
authorization:
  profile: read_only
  prohibited_actions: [edit, commit, push, pull_request_write, environment_mutation]
output_contract:
  schema: flightdeck.automation-report/v1
  source_freshness_required: true
  stable_finding_key: category_and_scope
  delta_states: [new, resolved, persistent, blocked]
  nonzero_diagnostic_policy: finding_not_job_failure

