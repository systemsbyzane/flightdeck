api_version: flightdeck.dev/v1alpha1
kind: AutomationTemplate
metadata:
  name: monthly-governance-audit
  display_name: Monthly Hub Governance Audit
enabled: false
activation:
  policy: explicit_user_enablement
  required_confirmation: [project_scope, schedule, timezone]
schedule:
  type: cron
  expression: "0 13 1 * *"
  timezone: Etc/UTC
task:
  workflow: daily-ops
  outcome: Detect registry, workflow, instruction, bridge, task, and automation drift.
authorization:
  profile: read_only
  prohibited_actions: [edit_registry, install_bridge, modify_project, modify_environment]
output_contract:
  schema: flightdeck.automation-report/v1
  source_freshness_required: true
  stable_finding_key: category_and_scope
  delta_states: [new, resolved, persistent, blocked]
  nonzero_diagnostic_policy: finding_not_job_failure

